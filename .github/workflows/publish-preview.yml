name: Publish preview to rabauer.dev/preview

# Builds the current production site (from main) at the root, and this
# branch's content under /preview, then deploys both together to GitHub
# Pages. This lets a work-in-progress blog post be viewed live at
# https://rabauer.dev/preview/ without touching the production workflow.
#
# Note: if `main` deploys again afterwards (via deploy.yml), it will
# redeploy only the root site and the /preview path will disappear until
# this workflow is re-run (push to `preview` again, or run manually).

on:
  push:
    branches:
      - preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production content)
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src

      - name: Checkout preview branch
        uses: actions/checkout@v6
        with:
          path: preview-src

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main-src/package-lock.json

      - name: Install dependencies (main)
        working-directory: main-src
        run: npm ci

      - name: Build production site
        working-directory: main-src
        run: npm run build

      - name: Install dependencies (preview)
        working-directory: preview-src
        run: npm ci

      - name: Build preview site under /preview
        working-directory: preview-src
        env:
          NEXT_BASE_PATH: /preview
        run: npm run build

      - name: Assemble combined output
        run: |
          mkdir -p combined-out
          cp -r main-src/out/. combined-out/
          rm -rf combined-out/preview
          mkdir -p combined-out/preview
          cp -r preview-src/out/. combined-out/preview/
          touch combined-out/.nojekyll

      - name: Debug output directory
        run: |
          echo "Contents of ./combined-out:"
          ls -la ./combined-out
          echo "Contents of ./combined-out/preview:"
          ls -la ./combined-out/preview

      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory ./combined-out \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
